services:
    app:
        image: '${SKRUM_IMAGE:-ghcr.io/arnaud-ritti/skrum:latest}'
        build: .
        restart: unless-stopped
        stop_grace_period: 20s
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            LOG_CHANNEL: stderr
            DB_CONNECTION: mariadb
            DB_HOST: mariadb
            DB_PORT: '3306'
            DB_DATABASE: '${DB_DATABASE:-skrum}'
            DB_USERNAME: '${DB_USERNAME:-skrum}'
            BROADCAST_CONNECTION: reverb
            REVERB_HOST: 127.0.0.1
            REVERB_PORT: '8080'
            REVERB_SCHEME: http
            REVERB_SERVER_HOST: 127.0.0.1
            REVERB_SERVER_PORT: '8080'
        ports:
            - '${SKRUM_HTTP_PORT:-80}:80'
            - '${SKRUM_HTTPS_PORT:-443}:443'
            - '${SKRUM_HTTPS_PORT:-443}:443/udp'
        volumes:
            - 'caddy-data:/data'
            - 'caddy-config:/config'
        depends_on:
            mariadb:
                condition: service_healthy
    mariadb:
        image: 'mariadb:11.8'
        restart: unless-stopped
        command:
            - '--character-set-server=utf8mb4'
            - '--collation-server=utf8mb4_nopad_bin'
            - '--transaction-isolation=READ-COMMITTED'
        environment:
            MARIADB_DATABASE: '${DB_DATABASE:-skrum}'
            MARIADB_USER: '${DB_USERNAME:-skrum}'
            MARIADB_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in your env file}'
            MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
        volumes:
            - 'mariadb-data:/var/lib/mysql'
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 10
volumes:
    caddy-data:
    caddy-config:
    mariadb-data:
