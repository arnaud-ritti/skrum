services:
    app:
        image: '${SKRUM_IMAGE:-ghcr.io/arnaud-ritti/skrum:latest}'
        build: .
        restart: unless-stopped
        stop_grace_period: 20s
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            LOG_CHANNEL: stderr
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: '5432'
            DB_DATABASE: '${DB_DATABASE:-skrum}'
            DB_USERNAME: '${DB_USERNAME:-skrum}'
            BROADCAST_CONNECTION: reverb
            REVERB_HOST: 127.0.0.1
            REVERB_PORT: '8080'
            REVERB_SCHEME: http
            REVERB_SERVER_HOST: 127.0.0.1
            REVERB_SERVER_PORT: '8080'
        ports:
            - '${SKRUM_HTTP_PORT:-8000}:8000'
            - '${SKRUM_HTTPS_PORT:-8443}:8443'
            - '${SKRUM_HTTPS_PORT:-8443}:8443/udp'
        volumes:
            - 'caddy-data:/data'
            - 'caddy-config:/config'
            - 'app-storage:/app/storage/app'
        depends_on:
            pgsql:
                condition: service_healthy
    pgsql:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE:-skrum}'
            POSTGRES_USER: '${DB_USERNAME:-skrum}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in your env file}'
        volumes:
            - 'pgsql-data:/var/lib/postgresql'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -q -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
volumes:
    caddy-data:
    caddy-config:
    app-storage:
    pgsql-data:
