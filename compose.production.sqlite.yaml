services:
    app:
        image: '${SKRUM_IMAGE:-ghcr.io/arnaud-ritti/skrum:latest}'
        build: .
        restart: unless-stopped
        stop_grace_period: 20s
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            LOG_CHANNEL: stderr
            DB_CONNECTION: sqlite
            DB_DATABASE: /app/database/data/skrum.sqlite
            SESSION_DRIVER: file
            CACHE_STORE: file
            BROADCAST_CONNECTION: reverb
            REVERB_HOST: 127.0.0.1
            REVERB_PORT: '8080'
            REVERB_SCHEME: http
            REVERB_SERVER_HOST: 127.0.0.1
            REVERB_SERVER_PORT: '8080'
        ports:
            - '${SKRUM_HTTP_PORT:-8000}:8000'
            - '${SKRUM_HTTPS_PORT:-8443}:8443'
            - '8443:8443/udp'
        volumes:
            - 'caddy-data:/data'
            - 'caddy-config:/config'
            - 'app-storage:/app/storage/app'
            - 'app-sessions:/app/storage/framework/sessions'
            - 'sqlite-data:/app/database/data'
volumes:
    caddy-data:
    caddy-config:
    app-storage:
    app-sessions:
    sqlite-data:
