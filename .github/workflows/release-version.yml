name: Prepare release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Stable version to prepare (for example 0.0.4)
                required: true
                type: string
    push:
        branches: [main]
        paths:
            - '.github/scripts/sync-release-version*'
            - '.github/workflows/release-version.yml'
            - '.github/workflows/docker-image.yml'
    pull_request:
        paths:
            - '.github/scripts/sync-release-version*'
            - '.github/workflows/release-version.yml'
            - '.github/workflows/docker-image.yml'

permissions:
    contents: read

concurrency:
    group: ${{ github.event_name == 'pull_request' && format('release-version-pr-{0}', github.event.pull_request.number) || 'release-version-references' }}
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
            - run: node --test .github/scripts/sync-release-version.test.mjs

    update:
        needs: test
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            pull-requests: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            RELEASE_TAG: ${{ inputs.version }}
            DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
            - name: Validate the requested version
              id: release
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ ! "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo "Expected a stable semantic version." >&2
                      exit 1
                  fi
                  version=${RELEASE_TAG#v}
                  for tag in "$version" "v$version"; do
                      if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
                          echo "Tag $tag already exists. Prepare a new version before publishing it." >&2
                          exit 1
                      fi
                  done
                  echo "version=$version" >> "$GITHUB_OUTPUT"
            - name: Update version references and open a pull request
              if: steps.release.outputs.version != ''
              env:
                  RELEASE_VERSION: ${{ steps.release.outputs.version }}
              shell: bash
              run: |
                  set -euo pipefail
                  node .github/scripts/sync-release-version.mjs "$RELEASE_VERSION"
                  composer update --lock --no-install --no-scripts --no-interaction --ignore-platform-reqs
                  if git diff --quiet; then
                      echo "Release references are already current."
                      exit 0
                  fi
                  branch="chore/release-version-$RELEASE_VERSION"
                  git switch -c "$branch"
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add compose.production*.yaml docs/coolify/skrum.yaml docs/coolify/README.md README.md .env.production.example config/skrum.php composer.json composer.lock website/src/snippets/install.sh website/src/content/docs/self-hosting
                  git commit -m "chore(release): sync references to $RELEASE_VERSION"
                  gh auth setup-git
                  if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
                      git fetch origin "$branch:refs/remotes/origin/$branch"
                  fi
                  git push --force-with-lease origin "$branch"
                  body_file=$(mktemp)
                  printf 'Update Composer, the application version fallback and any explicitly versioned deployment references to release %s. Preserve latest image references.\n\nMerge this pull request after its checks pass, then publish a release tagged v%s from the merged commit. The Docker workflow validates the tag before publishing the image. Existing installations keep their configured image until explicitly upgraded.\n' "$RELEASE_VERSION" "$RELEASE_VERSION" > "$body_file"
                  existing_pr=$(gh pr list --head "$branch" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number // empty')
                  if [[ -n "$existing_pr" ]]; then
                      gh pr edit "$existing_pr" --body-file "$body_file"
                  else
                      gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "chore(release): sync references to $RELEASE_VERSION" --body-file "$body_file"
                  fi
