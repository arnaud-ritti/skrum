name: Sync release version

on:
  workflow_call:
    inputs:
      version:
        description: Published stable release tag.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published stable release tag (empty uses the latest release).
        required: false
        type: string

permissions:
  contents: read

cache-mode: read

concurrency:
  group: release-version-sync
  cancel-in-progress: false

jobs:
  sync:
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      docs: ${{ steps.pr.outputs.docs }}
      base: ${{ steps.pr.outputs.base }}
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_TAG: ${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-app
        with:
          php-extensions: sockets, pdo_sqlite
      - name: Select the latest published stable release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [[ -n "$REQUESTED_TAG" && "${REQUESTED_TAG#v}" != "${latest_tag#v}" ]]; then
            echo "Skipping a release that is no longer the latest stable release."
            exit 0
          fi
          if [[ ! "$latest_tag" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable semantic version." >&2
            exit 1
          fi
          echo "version=${latest_tag#v}" >> "$GITHUB_OUTPUT"
      - name: Verify the published image is available
        if: steps.release.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: docker manifest inspect "ghcr.io/$GH_REPO:$RELEASE_VERSION" > /dev/null
      - name: Update repository references and open a pull request
        id: pr
        if: steps.release.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: bash .github/scripts/open-release-version-pr.sh

  validate:
    needs: sync
    if: needs.sync.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.sync.outputs.version }}
      EXPECTED_SHA: ${{ needs.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.base }}
          persist-credentials: false
      - uses: ./.github/actions/setup-app
        with:
          php-extensions: sockets, pdo_sqlite
      - name: Verify the commit contains only generated release references
        run: |
          set -euo pipefail
          git fetch origin "$EXPECTED_SHA"
          node .github/scripts/sync-release-version.mjs "$RELEASE_VERSION"
          composer update --lock --no-install --no-scripts --no-interaction --ignore-platform-reqs
          git add --update
          expected_tree=$(git write-tree)
          actual_tree=$(git rev-parse "$EXPECTED_SHA^{tree}")
          if [[ "$expected_tree" != "$actual_tree" ]]; then
              echo "Release commit contains changes beyond the generated version references." >&2
              exit 1
          fi
          node .github/scripts/sync-release-version.mjs "$RELEASE_VERSION" --check
          composer validate --no-check-publish --no-interaction
          php -l config/skrum.php
      - name: Test release tooling
        run: node --test .github/scripts/*.test.mjs

  validate-docs:
    needs: [sync, validate]
    if: needs.sync.outputs.pr != '' && needs.sync.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-docs

  merge:
    needs: [sync, validate, validate-docs]
    if: >-
      !cancelled() && needs.sync.outputs.pr != '' &&
      needs.validate.result == 'success' &&
      (needs.validate-docs.result == 'success' ||
      (needs.sync.outputs.docs != 'true' && needs.validate-docs.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.sync.outputs.pr }}
      EXPECTED_SHA: ${{ needs.sync.outputs.sha }}
    steps:
      - name: Merge only the version commit that passed validation
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$EXPECTED_SHA"
      - name: Deploy updated documentation
        if: needs.sync.outputs.docs == 'true'
        run: gh workflow run docs.yml --ref main
