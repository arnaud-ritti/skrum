name: tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - 'website/**'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: sockets, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Application
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          touch database/database.sqlite
          composer setup

      - name: Check the database and migrate from nothing in memory
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          php artisan skrum:check-database
          php artisan migrate:fresh --seed --force

      - name: Run CI Checks
        run: composer ci:check

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      databases: ${{ steps.databases.outputs.list }}

    steps:
      - name: Choose the engines of this run
        id: databases
        env:
          EVENT: ${{ github.event_name }}
        run: |
          postgres='"port":5432,"username":"skrum","health":"pg_isready -U skrum -d testing"'
          mariadb='"port":3306,"username":"root","health":"healthcheck.sh --connect --innodb_initialized"'
          mysql='"port":3306,"username":"root","health":"mysqladmin ping -h 127.0.0.1 -ppassword"'

          every_push='{"driver":"pgsql","image":"postgres:18-alpine","label":"pgsql 18",'"$postgres"'},{"driver":"mariadb","image":"mariadb:10.11","label":"mariadb 10.11",'"$mariadb"'}'
          nightly='{"driver":"mysql","image":"mysql:8.4","label":"mysql 8.4",'"$mysql"'},{"driver":"pgsql","image":"postgres:14-alpine","label":"pgsql 14",'"$postgres"'},{"driver":"mariadb","image":"mariadb:11.8","label":"mariadb 11.8",'"$mariadb"'}'

          # Every engine runs the suite and the concurrency suite as two time-balanced halves each (tests/.pest/shards.json).
          split_in_parts() {
              echo "$1" | jq -c '[.[] as $database | ({suite:"main",shard:"1/2"},{suite:"main",shard:"2/2"},{suite:"concurrency",shard:"1/2"},{suite:"concurrency",shard:"2/2"}) as $part | $database + $part | .label += " \(.suite) \(.shard | sub("/"; " of "))"]'
          }

          if [ "$EVENT" = schedule ]; then
              echo "list=$(split_in_parts "[$nightly]")" >> "$GITHUB_OUTPUT"
          else
              echo "list=$(split_in_parts "[$every_push]")" >> "$GITHUB_OUTPUT"
          fi

  database:
    name: database (${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.databases) }}

    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: skrum
          POSTGRES_PASSWORD: password
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DB_ON_HOST: 1
      TEST_DB_PORT: ${{ matrix.port }}
      TEST_DB_USERNAME: ${{ matrix.username }}
      TEST_DB_PASSWORD: password
      TEST_DB_PROCESSES: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: sockets, pdo_pgsql, pdo_mysql, pdo_sqlite, pcntl
          tools: composer:v2
          coverage: none

      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and build
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          npm run build
          cp .env.example .env
          php artisan key:generate

      - name: Check the database and migrate from nothing
        env:
          DB_CONNECTION: ${{ matrix.driver }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: password
        run: |
          php artisan skrum:check-database
          php artisan migrate:fresh --seed --force

      - name: Feature, Unit and Arch suites
        if: matrix.suite == 'main'
        env:
          DRIVER: ${{ matrix.driver }}
          TEST_DB_SHARD: ${{ matrix.shard }}
        run: bin/test-db "$DRIVER"

      - name: Concurrency suite
        if: matrix.suite == 'concurrency'
        env:
          DRIVER: ${{ matrix.driver }}
          TEST_DB_SHARD: ${{ matrix.shard }}
        run: bin/test-db "$DRIVER" --concurrency

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-db-${{ matrix.label }}
          path: storage/logs
          if-no-files-found: ignore

  sqlite-file:
    name: sqlite-file (${{ matrix.shard }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']

    env:
      TEST_DB_ON_HOST: 1
      TEST_DB_SHARD: ${{ matrix.shard }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: sockets, pdo_sqlite, pcntl
          tools: composer:v2
          coverage: none

      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and build
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          npm run build
          cp .env.example .env
          php artisan key:generate

      - name: Check the database and migrate from nothing
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/ci.sqlite
        run: |
          touch database/ci.sqlite
          php artisan skrum:check-database
          php artisan migrate:fresh --seed --force

      - name: Database tests on a file
        if: matrix.shard == '1/2'
        run: bin/test-db sqlite-file -- tests/Feature/Database

      - name: Concurrency suite
        run: bin/test-db sqlite-file --concurrency

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-db-sqlite-file-${{ strategy.job-index }}
          path: storage/logs
          if-no-files-found: ignore

  browser:
    name: browser (${{ matrix.suite }} ${{ matrix.shard }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: main, shard: '1/16' }
          - { suite: main, shard: '2/16' }
          - { suite: main, shard: '3/16' }
          - { suite: main, shard: '4/16' }
          - { suite: main, shard: '5/16' }
          - { suite: main, shard: '6/16' }
          - { suite: main, shard: '7/16' }
          - { suite: main, shard: '8/16' }
          - { suite: main, shard: '9/16' }
          - { suite: main, shard: '10/16' }
          - { suite: main, shard: '11/16' }
          - { suite: main, shard: '12/16' }
          - { suite: main, shard: '13/16' }
          - { suite: main, shard: '14/16' }
          - { suite: main, shard: '15/16' }
          - { suite: main, shard: '16/16' }
          - { suite: docs, shard: '1/2' }
          - { suite: docs, shard: '2/2' }

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: skrum
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skrum -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: skrum
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: sockets, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Cache the Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create the environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build the assets
        run: npm run build

      - name: Run the browser suite
        timeout-minutes: 25
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
          BROWSER_SHARD_PART: ${{ matrix.shard }}
        run: |
          php artisan config:clear --ansi
          mkdir -p storage/logs/browser
          if [ "$BROWSER_SUITE" = docs ]; then
              paths=(tests/Browser/Docs)
          else
              paths=(tests/Browser/Smoke tests/Browser/Walkthroughs tests/Browser/Visual)
          fi
          set -o pipefail
          vendor/bin/pest "${paths[@]}" --shard="$BROWSER_SHARD_PART" --bail --profile 2>&1 | tee storage/logs/browser/tests.log

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.suite }}-${{ strategy.job-index }}
          path: |
            storage/logs
            tests/Browser/Screenshots
            tests/Browser/Traces
          if-no-files-found: ignore
