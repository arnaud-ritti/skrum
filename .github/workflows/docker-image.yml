name: Docker image

on:
    release:
        types: [published]
    push:
        branches: [main]
        paths-ignore: ['website/**', '.github/workflows/docs.yml']
    pull_request:
        paths-ignore: ['website/**', '.github/workflows/docs.yml']

permissions:
    contents: read

concurrency:
    group: ${{ github.event_name == 'release' && 'docker-release' || format('docker-{0}-{1}', github.event_name, github.ref) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    image:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write # pushes the image to ghcr.io
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: ${{ github.event_name == 'release' && '0' || '1' }}

            - name: Verify the released commit was merged
              if: github.event_name == 'release'
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              if: github.event_name == 'release' && !github.event.release.prerelease
              with:
                  node-version: '22'

            - name: Synchronize stable release references in the image sources
              if: github.event_name == 'release' && !github.event.release.prerelease
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  node .github/scripts/sync-release-version.mjs "$RELEASE_TAG"
                  composer update --lock --no-install --no-scripts --no-interaction --ignore-platform-reqs
                  node .github/scripts/sync-release-version.mjs "$RELEASE_TAG" --check
                  composer validate --no-check-publish --no-interaction

            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              if: github.event_name != 'pull_request'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/${{ github.repository }}
                  flavor: latest=false
                  tags: |
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: SKRUM_VERSION=${{ steps.meta.outputs.version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Promote the latest stable release image
              if: github.event_name == 'release' && !github.event.release.prerelease
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
                  if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
                      docker buildx imagetools create --tag "ghcr.io/$GH_REPO:latest" "ghcr.io/$GH_REPO@$IMAGE_DIGEST"
                  fi

    sync-version:
        needs: image
        if: github.event_name == 'release' && !github.event.release.prerelease
        permissions:
            contents: write
            pull-requests: write
            actions: write
        uses: ./.github/workflows/release-version.yml
        with:
            version: ${{ github.event.release.tag_name }}
