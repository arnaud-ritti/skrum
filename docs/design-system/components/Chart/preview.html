<!doctype html>

<head><meta charset="utf-8"><title>Chart</title>
<style>
  .ch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: var(--space-5); }
  .ch-plot { position: relative; }
  .ch-plot svg { overflow: visible; }
  .sk-chart .val { fill: var(--foreground); font-size: 0.6875rem; font-weight: 700; font-family: var(--font-sans); }
  .sk-chart .lbl { font-size: 0.6875rem; font-weight: 600; font-family: var(--font-sans); }
  .ch-tip { position: absolute; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-popover); padding: 0.5rem 0.625rem; font-size: 0.75rem; line-height: 1rem; min-width: 9.375rem; display: flex; flex-direction: column; gap: 0.25rem; pointer-events: none; }
  .ch-tip-t { font-weight: 650; }
  .ch-tip-r { display: flex; align-items: center; gap: 0.375rem; color: var(--muted-foreground); }
  .ch-tip-r b { margin-left: auto; color: var(--foreground); font-variant-numeric: tabular-nums; }
  .ch-sw { width: 0.625rem; height: 0.625rem; border-radius: 0.1875rem; flex: none; }
  .ch-pal { display: flex; gap: var(--space-4); flex-wrap: wrap; font-size: 0.75rem; color: var(--muted-foreground); }
  .ch-pal span { display: inline-flex; align-items: center; gap: 0.375rem; }
  .ch-pal i { width: 1.75rem; height: 0.875rem; border-radius: 0.25rem; display: inline-block; }
</style></head>
