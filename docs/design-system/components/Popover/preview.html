<!-- @dsCard width=960 group="shadcn · Overlays" height=415 subtitle="Popover + Tooltip — popover de réactions emoji, popover réglage du timer, tooltip simple, tooltip avec raccourci, tooltip bas" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Popover</title>
<style>
  .po-grid { display: grid; grid-template-columns: 18.75rem 1fr; gap: var(--space-10); }
  .po-anchor { position: relative; display: inline-flex; }
  .po-emo { display: grid; grid-template-columns: repeat(6, 2.25rem); gap: 0.25rem; }
  .po-emo button { width: 2.25rem; height: 2.25rem; border-radius: var(--radius-md); border: 0; background: transparent; font-size: 1.25rem; display: grid; place-items: center; }
  .po-emo button.is-on { background: var(--skrum-primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
  .po-emo button.is-hover { background: var(--accent); }
  .po-tt-arrow { position: absolute; width: 0.5rem; height: 0.5rem; background: var(--foreground); transform: rotate(45deg); }
  .po-tt-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; position: relative; }
  .po-cell { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); }
  .po-tts { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-6); align-items: end; }
</style></head>
<body>
<div class="sk-pad po-grid sk-canvas">
  <div class="po-cell">
    <div class="sk-state">Popover · réactions emoji</div>
    <article class="sk-rcard sk-c-sun" style="width:17.5rem">
      <p class="sk-rcard-text">Le pair-programming du jeudi a débloqué la migration Postgres.</p>
      <div class="sk-reactions"><span class="sk-react is-mine">🎉 4</span><span class="sk-react">💡 2</span><span class="sk-react sk-react-add" style="box-shadow:0 0 0 2px var(--ring)"><i data-lucide="smile-plus" class="sk-ico-sm"></i></span></div>
    </article>
    <div class="sk-popover" role="dialog" aria-label="Ajouter une réaction" style="position:relative;padding:var(--space-2);margin-left:4.25rem;margin-top:0.375rem">
      <div class="po-emo">
        <button class="is-on" aria-pressed="true" aria-label="Fête">🎉</button><button aria-label="Idée">💡</button><button class="is-hover" aria-label="Cœur">❤️</button><button aria-label="Rire">😂</button><button aria-label="Pouce">👍</button><button aria-label="Fusée">🚀</button>
        <button aria-label="Feu">🔥</button><button aria-label="Applaudir">👏</button><button aria-label="Pensif">🤔</button><button aria-label="Surprise">😮</button><button aria-label="Triste">😢</button><button aria-label="Cible">🎯</button>
      </div>
    </div>
  </div>

  <div class="sk-col sk-gap-8">
    <div class="po-cell">
      <div class="sk-state">Popover · réglage rapide</div>
      <div class="sk-row sk-gap-2"><span class="sk-timer"><span class="sk-timer-ring" style="--p:.62"></span>04:58</span><button class="sk-btn sk-btn--outline sk-btn--icon is-focus" aria-label="Régler le timer" aria-expanded="true"><i data-lucide="timer"></i></button></div>
      <div class="sk-popover sk-col sk-gap-3" style="width:18.75rem;position:relative;margin-left:2.5rem;margin-top:0.25rem">
        <div class="sk-col sk-gap-1"><span class="sk-strong">Timer de phase</span><span class="sk-help">Visible par tous les participants.</span></div>
        <div class="sk-row sk-gap-2"><button class="sk-btn sk-btn--secondary sk-btn--sm">+1 min</button><button class="sk-btn sk-btn--secondary sk-btn--sm">+5 min</button><button class="sk-btn sk-btn--outline sk-btn--sm"><i data-lucide="pause"></i>Pause</button></div>
      </div>
    </div>

    <div>
      <div class="sk-state">Tooltips</div>
      <div class="po-tts" style="padding-top:var(--space-2)">
        <div class="po-tt-wrap"><span class="sk-tooltip" role="tooltip" style="position:relative">Copier le lien d'invitation<span class="po-tt-arrow" style="bottom:-0.1875rem;left:50%;margin-left:-0.25rem"></span></span><button class="sk-btn sk-btn--outline sk-btn--icon is-hover" aria-label="Copier le lien"><i data-lucide="link-2"></i></button><span class="sk-xs sk-muted">Simple</span></div>
        <div class="po-tt-wrap"><span class="sk-tooltip" role="tooltip" style="position:relative">Phase suivante <span class="sk-kbd">⌘</span><span class="sk-kbd">→</span><span class="po-tt-arrow" style="bottom:-0.1875rem;left:50%;margin-left:-0.25rem"></span></span><button class="sk-btn sk-btn--icon is-focus" aria-label="Phase suivante" aria-keyshortcuts="Meta+ArrowRight"><i data-lucide="arrow-right"></i></button><span class="sk-xs sk-muted">Avec raccourci</span></div>
        <div class="po-tt-wrap"><span class="sk-xs sk-muted">En dessous</span><span class="sk-avatar sk-p9 is-typing" style="color:var(--skrum-presence-9)"><span style="color:var(--skrum-presence-9-foreground)">IB</span></span><span class="sk-tooltip" role="tooltip" style="position:relative">Inès B. · en train d'écrire<span class="po-tt-arrow" style="top:-0.1875rem;left:50%;margin-left:-0.25rem"></span></span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
