<!-- @dsCard group="shadcn · Affichage" height=392 subtitle="Avatar — tailles xs → xl, initiales sur les 12 couleurs de présence, invité, en ligne / absent, en train d'écrire, image + fallback, pile" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Avatar</title>
<style>
  .av-p { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--space-2); }
  .av-p > div { display: flex; flex-direction: column; align-items: center; gap: 0.375rem; font-size: 0.6875rem; color: var(--muted-foreground); }
  .av-cap { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--muted-foreground); text-align: center; }
  .av-img { background: color-mix(in oklch, var(--skrum-presence-7) 60%, var(--card)); overflow: hidden; }
  .av-img svg { width: 100%; height: 100%; display: block; }
  .av-broken { position: relative; }
</style></head>
<body>
<div class="sk-pad sk-col sk-gap-6">
  <div class="sk-row" style="gap:var(--space-10);align-items:flex-start">
    <div><div class="sk-state">Tailles</div>
      <div class="sk-row sk-gap-4" style="align-items:flex-end">
        <div class="av-cap"><span class="sk-avatar sk-avatar--xs sk-p1">AR</span>xs 20</div>
        <div class="av-cap"><span class="sk-avatar sk-avatar--sm sk-p1">AR</span>sm 24</div>
        <div class="av-cap"><span class="sk-avatar sk-p1">AR</span>md 32</div>
        <div class="av-cap"><span class="sk-avatar sk-avatar--lg sk-p1">AR</span>lg 40</div>
        <div class="av-cap"><span class="sk-avatar sk-avatar--xl sk-p1">AR</span>xl 56</div>
      </div></div>
    <div><div class="sk-state">États</div>
      <div class="sk-row sk-gap-6" style="align-items:flex-end">
        <div class="av-cap"><span class="sk-avatar sk-avatar--lg sk-p3">IB<span class="sk-status"></span></span>En ligne</div>
        <div class="av-cap"><span class="sk-avatar sk-avatar--lg sk-p8">MB<span class="sk-status is-away"></span></span>Absent</div>
        <div class="av-cap"><span class="sk-avatar sk-avatar--lg sk-p5 is-typing" style="color:var(--skrum-presence-5)"><span style="color:var(--skrum-presence-5-foreground)">SL</span></span><span class="sk-typing"><span class="sk-trema"><i></i><i></i></span>écrit</span></div>
        <div class="av-cap"><span class="sk-avatar sk-avatar--lg sk-avatar--guest"><i data-lucide="user-round"></i></span>Invité</div>
        <div class="av-cap"><span class="sk-avatar sk-avatar--lg sk-avatar--guest">?</span>Anonyme</div>
      </div></div>
  </div>

  <div><div class="sk-state">Initiales · 12 couleurs de présence</div>
    <div class="av-p">
      <div><span class="sk-avatar sk-avatar--lg sk-p1">AR</span>p1</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p2">TM</span>p2</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p3">IB</span>p3</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p4">CR</span>p4</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p5">SL</span>p5</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p6">NK</span>p6</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p7">YT</span>p7</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p8">MB</span>p8</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p9">LD</span>p9</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p10">HG</span>p10</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p11">LH</span>p11</div>
      <div><span class="sk-avatar sk-avatar--lg sk-p12">BV</span>p12</div>
    </div></div>

  <div class="sk-row" style="gap:var(--space-10);align-items:flex-start">
    <div><div class="sk-state">Image · fallback</div>
      <div class="sk-row sk-gap-6" style="align-items:flex-end">
        <div class="av-cap"><span class="sk-avatar sk-avatar--lg av-img" role="img" aria-label="Photo de Yuki T."><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="16" r="7" style="fill:var(--skrum-presence-7)"/><path d="M6 40 C8 29 14 25 20 25 C26 25 32 29 34 40 Z" style="fill:var(--skrum-presence-7)"/></svg></span>Image chargée</div>
        <div class="av-cap"><span class="sk-avatar sk-avatar--lg sk-skel"></span>Chargement</div>
        <div class="av-cap"><span class="sk-avatar sk-avatar--lg sk-p7">YT</span>Échec → initiales</div>
      </div></div>
    <div><div class="sk-state">Pile de présence</div>
      <div class="sk-row sk-gap-4">
        <span class="sk-stack"><span class="sk-avatar sk-p1">AR</span><span class="sk-avatar sk-p3">IB</span><span class="sk-avatar sk-p5 is-typing" style="--typing:var(--skrum-presence-5)">SL</span><span class="sk-avatar sk-p6">NK</span><span class="sk-avatar sk-avatar--guest"><i data-lucide="user-round" class="sk-ico-sm"></i></span><span class="sk-avatar sk-stack-more">+4</span></span>
        <span class="sk-typing"><span class="sk-trema"><i></i><i></i></span>Sofia écrit…</span>
      </div></div>
  </div>
</div>
</body>
</html>
