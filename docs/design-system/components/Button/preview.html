<!-- @dsCard group="shadcn · Actions" height=300 subtitle="default · secondary · outline · ghost · destructive · link — sm / md / lg / icon — hover, focus, disabled, loading" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="sk-pad sk-col sk-gap-6">
  <div>
    <div class="sk-state">Variantes</div>
    <div class="sk-row">
      <button class="sk-btn"><i data-lucide="plus"></i>Nouvelle rétro</button>
      <button class="sk-btn sk-btn--secondary">Rejoindre</button>
      <button class="sk-btn sk-btn--outline"><i data-lucide="share-2"></i>Partager le lien</button>
      <button class="sk-btn sk-btn--ghost">Annuler</button>
      <button class="sk-btn sk-btn--destructive"><i data-lucide="trash-2"></i>Supprimer la session</button>
      <button class="sk-btn sk-btn--link">Voir toutes les actions</button>
    </div>
  </div>
  <div>
    <div class="sk-state">Tailles &amp; icône</div>
    <div class="sk-row">
      <button class="sk-btn sk-btn--sm">Petit</button>
      <button class="sk-btn">Moyen</button>
      <button class="sk-btn sk-btn--lg">Démarrer la session</button>
      <button class="sk-btn sk-btn--icon sk-btn--outline" aria-label="Paramètres"><i data-lucide="settings-2"></i></button>
      <button class="sk-btn sk-btn--icon sk-btn--ghost sk-btn--sm" aria-label="Plus d'options"><i data-lucide="ellipsis"></i></button>
      <button class="sk-btn sk-btn--icon sk-btn--lg" aria-label="Phase suivante"><i data-lucide="arrow-right"></i></button>
    </div>
  </div>
  <div>
    <div class="sk-state">États</div>
    <div class="sk-row">
      <button class="sk-btn is-hover">Survol</button>
      <button class="sk-btn is-focus">Focus clavier</button>
      <button class="sk-btn sk-btn--outline is-focus">Focus outline</button>
      <button class="sk-btn is-disabled" disabled>Désactivé</button>
      <button class="sk-btn"><span class="sk-spinner"></span>Création…</button>
      <button class="sk-btn sk-btn--outline"><span class="sk-trema"><i></i><i></i></span>Connexion</button>
    </div>
  </div>
</div>
</body>
</html>
